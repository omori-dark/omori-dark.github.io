<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Marcha Analítica - 20 Preguntas</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7fc; margin: 0; padding: 20px; color: #1e2a3a; }
    .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #0b3b5c; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #4a6a8a; margin-bottom: 30px; }
    .question { background: #f9fbfe; border-left: 5px solid #e67e22; padding: 15px 20px; margin-bottom: 20px; border-radius: 8px; transition: 0.2s; }
    .question p { margin: 0 0 10px 0; font-size: 1.05rem; }
    .option { display: block; margin: 8px 0; padding: 8px 12px; background: white; border-radius: 6px; border: 1px solid #d0dce8; cursor: pointer; transition: 0.2s; }
    .option:hover { background: #e8f0fa; }
    .option input { margin-right: 10px; transform: scale(1.1); }
    .feedback { margin-top: 10px; font-weight: 600; padding: 6px 10px; border-radius: 6px; }
    .correct { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
    .incorrect { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
    button { display: block; width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold; background: #e67e22; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 30px; transition: 0.2s; }
    button:hover { background: #d35400; }
    #result { margin-top: 30px; text-align: center; font-size: 1.4rem; font-weight: bold; color: #0b3b5c; padding: 20px; background: #e8f0fa; border-radius: 12px; }
  </style>
</head>
<body>
<div class="container">
  <h1>🔬 Quiz de Marcha Analítica</h1>
  <p class="subtitle">20 preguntas exclusivas sobre el flujograma de laboratorio</p>
  <form id="quizForm"></form>
  <button onclick="calificar()">Calificar quiz</button>
  <div id="result"></div>
</div>

<script>
  const questions = [
    // RUTA DE CARBOHIDRATOS
    { q: "¿Cuál es la primera reacción que se realiza en la ruta de los carbohidratos?", options: ["Ninhidrina", "Benedict", "Bial", "Seliwanoff"], correct: 1 },
    { q: "¿Qué identifica la Reacción de Benedict en la marcha analítica?", options: ["Aminoácidos", "Cetosas", "Azúcares reductores", "Pentosas"], correct: 2 },
    { q: "Si la Reacción de Benedict da un resultado NEGATIVO, ¿qué significa?", options: ["Hay cetosas", "No hay azúcares reductores", "Hay aminoácidos", "Es glucosa"], correct: 1 },
    { q: "Si la Reacción de Benedict da POSITIVO, ¿cuál es la siguiente prueba a realizar?", options: ["Bial", "Seliwanoff", "Ninhidrina", "Tiogrupos"], correct: 0 },
    { q: "¿Qué identifica la Reacción de Bial?", options: ["Cetosas", "Pentosas", "Aldosas", "Aminoácidos"], correct: 1 },
    { q: "Si la Reacción de Bial da POSITIVO, ¿qué sustancia específica tienes?", options: ["Glucosa", "Fructosa", "Ribosa", "Cisteína"], correct: 2 },
    { q: "Si la Reacción de Bial da NEGATIVO, ¿cuál es la siguiente prueba?", options: ["Benedict", "Seliwanoff", "Adam Kiewics", "Xantoproteica"], correct: 1 },
    { q: "¿Qué identifica la Reacción de Seliwanoff?", options: ["Pentosas", "Cetosas", "Aldosas", "Proteínas"], correct: 1 },
    { q: "Si la Reacción de Seliwanoff da POSITIVO, ¿qué sustancia específica tienes?", options: ["Glucosa", "Ribosa", "Fructosa", "Tirosina"], correct: 2 },
    { q: "Si Benedict es positivo, Bial negativo y Seliwanoff negativo, ¿qué sustancia tienes?", options: ["Fructosa", "Ribosa", "Glucosa", "No se puede saber"], correct: 2 },

    // RUTA DE AMINOÁCIDOS
    { q: "¿Cuál es la primera reacción en la ruta de los aminoácidos?", options: ["Ninhidrina", "Benedict", "Tiogrupos", "Xantoproteica"], correct: 0 },
    { q: "¿Qué identifica la Reacción de Ninhidrina?", options: ["Azúcares reductores", "Aminoácidos en general", "Pentosas", "Triptófano"], correct: 1 },
    { q: "Si la Reacción de Ninhidrina da POSITIVO, ¿cuál es la siguiente prueba?", options: ["Tiogrupos", "Adam Kiewics", "Xantoproteica", "Bial"], correct: 0 },
    { q: "¿Qué identifica la Reacción de Tiogrupos?", options: ["Triptófano", "Tirosina", "Aminoácidos con grupo -SH", "Glicina"], correct: 2 },
    { q: "Si la Reacción de Tiogrupos da POSITIVO, ¿qué aminoácido tienes?", options: ["Cisteína", "Triptófano", "Tirosina", "Glicina"], correct: 0 },
    { q: "Si la Reacción de Tiogrupos da NEGATIVO, ¿cuál es la siguiente prueba?", options: ["Ninhidrina", "Adam Kiewics", "Xantoproteica", "Benedict"], correct: 1 },
    { q: "¿Qué identifica la Reacción de Adam Kiewics?", options: ["Tirosina", "Cisteína", "Triptófano", "Glicina"], correct: 2 },
    { q: "Si la Reacción de Adam Kiewics da POSITIVO, ¿qué aminoácido tienes?", options: ["Triptófano", "Tirosina", "Cisteína", "Glicina"], correct: 0 },
    { q: "Si Ninhidrina es positiva, Tiogrupos negativa, Adam Kiewics negativa y Xantoproteica POSITIVA, ¿qué aminoácido tienes?", options: ["Cisteína", "Triptófano", "Tirosina", "Glicina"], correct: 2 },
    { q: "Si Ninhidrina es positiva, pero Tiogrupos, Adam Kiewics y Xantoproteica son NEGATIVAS, ¿qué aminoácido tienes?", options: ["Cisteína", "Triptófano", "Tirosina", "Glicina"], correct: 3 }
  ];

  const form = document.getElementById('quizForm');

  questions.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<p><strong>${index + 1}. ${item.q}</strong></p>`;
    
    item.options.forEach((opt, i) => {
      const label = document.createElement('label');
      label.className = 'option';
      label.innerHTML = `<input type="radio" name="q${index}" value="${i}"> ${opt}`;
      div.appendChild(label);
    });
    form.appendChild(div);
  });

  function calificar() {
    let score = 0;
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '';

    questions.forEach((item, index) => {
      const selected = form.querySelector(`input[name="q${index}"]:checked`);
      const questionDiv = form.children[index];
      
      const oldFeedback = questionDiv.querySelector('.feedback');
      if (oldFeedback) oldFeedback.remove();

      const feedback = document.createElement('div');
      feedback.className = 'feedback';

      if (selected) {
        const val = parseInt(selected.value);
        if (val === item.correct) {
          score++;
          feedback.textContent = '✅ Correcto';
          feedback.classList.add('correct');
        } else {
          feedback.textContent = `❌ Incorrecto. La correcta es: ${item.options[item.correct]}`;
          feedback.classList.add('incorrect');
        }
      } else {
        feedback.textContent = `⚠️ No respondiste. La correcta es: ${item.options[item.correct]}`;
        feedback.classList.add('incorrect');
      }
      questionDiv.appendChild(feedback);
    });

    resultDiv.innerHTML = `<h2>Puntuación: ${score} / ${questions.length}</h2>`;
    if (score === 20) {
      resultDiv.innerHTML += `<p style="font-size:1rem; color:#28a745;">¡Perfecto! Dominas la marcha analítica al 100%.</p>`;
    } else if (score >= 15) {
      resultDiv.innerHTML += `<p style="font-size:1rem; color:#e67e22;">¡Muy bien! Solo repasa las que fallaste.</p>`;
    } else {
      resultDiv.innerHTML += `<p style="font-size:1rem; color:#dc3545;">Te recomiendo repasar el flujograma de tus fotos antes del examen.</p>`;
    }
    resultDiv.scrollIntoView({ behavior: 'smooth' });
  }
</script>
</body>
</html>
